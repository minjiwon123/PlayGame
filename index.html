<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서울예대 2027 인터랙티브 미연시</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6efe7;

        --app-bg: linear-gradient(
          180deg,
          #fff8f1 0%,
          #ffe7d6 45%,
          #ffd9e8 100%
        );

        --primary: #ff8fb1;
        --primary-soft: #ffd0df;

        --card: rgba(255, 255, 255, 0.92);

        --text: #4b3d39;
        --sub: #7b6d67;

        --hover: #fff1f5;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Pretendard', sans-serif;
      }
      body {
        width: 100%;
        height: 100dvh;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #app-container {
        width: 100%;
        max-width: 420px;
        height: 100dvh;
        background: var(--app-bg);
        position: relative;
        overflow: hidden;
        box-shadow:
          0 20px 50px rgba(255, 182, 193, 0.25),
          0 10px 30px rgba(0, 0, 0, 0.08);

        border: 3px solid rgba(255, 255, 255, 0.7);
      }
      @media (min-height: 700px) and (min-width: 421px) {
        #app-container {
          height: 85vh;
          max-height: 840px;
          border-radius: 24px;
          border: 4px solid #fff;
        }
      }
      .screen {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 24px;
        overflow: hidden;
        overflow-y: auto;
      }
      .screen.active {
        display: flex;
      }

      #novelScreen {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #openingScreen {
        background:
          linear-gradient(rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.1)),
          url('images/ui/opening-bg.jpg');

        background-size: cover;
        background-position: center;
      }

      #bgLayer {
        position: absolute;
        inset: 0;

        background-size: cover;
        background-position: center;

        z-index: 0;

        transition: 0.5s;
        pointer-events: none;
      }

      .opening-title {
        font-size: 26px;
        line-height: 1.4;
        text-align: center;
        font-weight: 700;
        margin-bottom: 12px;
        color: #0f172a;
        letter-spacing: -0.5px;
        text-shadow: 0 2px 10px rgba(255, 255, 255, 0.7);
      }
      .opening-sub {
        font-size: 14px;
        line-height: 1.6;
        text-align: center;
        color: var(--sub);
        margin-bottom: 40px;
      }
      .main-btn {
        width: 100%;
        max-width: 280px;
        height: 54px;

        border: 2px solid rgba(255, 255, 255, 0.8);

        border-radius: 999px;

        background: linear-gradient(135deg, #ff9fbe, #ffc7d9);

        color: white;

        font-size: 15px;
        font-weight: 700;

        cursor: pointer;

        box-shadow: 0 8px 20px rgba(255, 143, 177, 0.35);

        transition: 0.25s;
      }
      .main-btn:hover {
        transform: translateY(-2px) scale(1.02);
      }
      .test-container {
        width: 100%;
      }
      .progress {
        width: 100%;
        height: 8px;
        background: rgba(0, 0, 0, 0.05);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 30px;
      }
      .progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, var(--primary), var(--primary-soft));
        border-radius: 999px;
        transition: width 0.3s ease;
      }
      .question-number {
        font-size: 12px;
        font-weight: 600;
        color: var(--primary);
        margin-bottom: 12px;
      }
      .question {
        font-size: 19px;
        line-height: 1.5;
        font-weight: 700;
        margin-bottom: 24px;
        color: #0f172a;
      }
      .answer-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .answer-btn {
        width: 100%;
        min-height: 58px;
        padding: 14px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 16px;
        background: var(--card);
        text-align: left;
        cursor: pointer;
        transition: 0.2s;
        font-size: 14px;
        line-height: 1.4;
      }
      .answer-btn:hover {
        background: var(--hover);
      }

      .result-box {
        width: 100%;
        max-height: 85%;
        padding: 24px 20px;
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .result-title {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
        text-align: center;
      }

      .info-card {
        background: rgba(0, 0, 0, 0.03);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 16px;
        font-size: 13px;
        line-height: 1.6;
      }
      .info-card strong {
        color: var(--primary);
      }
      .info-card ul {
        margin-left: 18px;
        margin-top: 4px;
      }

      .link-btn {
        width: 100%;
        height: 46px;
        border: 1px solid var(--primary);
        border-radius: 12px;
        background: #fff;
        color: var(--primary);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
        margin-bottom: 8px;
        transition: 0.2s;
      }
      .link-btn:hover {
        background: var(--hover);
      }

      .top-ui {
        position: absolute;
        top: 18px;
        left: 20px;
        font-size: 11px;
        font-weight: 600;
        color: var(--primary);
        z-index: 10;
      }
      .location-tag {
        position: absolute;
        top: 18px;
        right: 20px;
        font-size: 11px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        padding: 4px 10px;
        border-radius: 12px;
        z-index: 10;
      }
      .character {
        position: absolute;
        bottom: 30%;
        left: 50%;
        transform: translateX(-50%);
        max-height: 55vh;
        filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.18));

        bottom: 28%;
        width: auto;
        object-fit: contain;
        pointer-events: none;
        z-index: 2;
        transition: opacity 0.2s ease-in-out;
      }

      .dialogue-box {
        position: absolute;

        left: 50%;
        bottom: 6px;

        transform: translateX(-50%);

        width: calc(100% - 24px);

        height: 220px;

        padding: 16px 18px 20px;

        background: linear-gradient(
          to top,
          rgba(255, 255, 255, 0.96),
          rgba(255, 255, 255, 0.88)
        );

        backdrop-filter: blur(10px);

        border-radius: 24px;

        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.12),
          0 0 0 1px rgba(255, 255, 255, 0.4);

        z-index: 20;

        display: flex;
        flex-direction: column;
      }
      .name {
        font-size: 13px;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 8px;
        background: #ffe4e6;
        padding: 4px 12px;
        border-radius: 20px;
        display: inline-block;
        box-shadow: 0 4px 10px rgba(255, 143, 177, 0.18);

        font-size: 12px;
        letter-spacing: 0.3px;
      }
      .dialogue {
        font-size: 14px;
        line-height: 1.6;
        color: #334155;

        margin-bottom: 10px;

        max-height: 120px;
        overflow-y: auto;

        pointer-events: none;
      }
      .next-tip {
        font-size: 11px;
        color: #94a3b8;
        text-align: right;
        animation: blink 1.5s infinite;
        pointer-events: none;
      }
      .choices {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        margin-top: auto;
      }
      .choice-btn {
        width: 100%;
        min-height: 40px;
        padding: 10px 12px;
        border: 1px solid var(--primary-soft);
        border-radius: 12px;
        background: #fff;
        color: var(--text);
        text-align: left;
        font-size: 13px;
        cursor: pointer;
      }
      .choice-btn:hover {
        background: var(--hover);
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }
      .tarot-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-top: 30px;
        justify-items: center;
      }
      .tarot-card {
        width: 78px;
        height: 125px;
        border-radius: 16px;
        background: linear-gradient(135deg, #1e1b4b, #7c3aed);
        cursor: pointer;
        position: relative;
        transform-style: preserve-3d;
        transition: 0.6s;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      }

      #tarotScreen {
        justify-content: flex-start;
        padding-top: 40px;
      }

      .tarot-card.flipped {
        transform: rotateY(180deg);
      }

      .tarot-front,
      .tarot-back {
        position: absolute;
        inset: 0;
        border-radius: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        backface-visibility: hidden;
        text-align: center;
      }

      .tarot-front {
        background: linear-gradient(135deg, #111827, #312e81);
        color: white;
        font-size: 12px;
      }

      .tarot-back {
        background: transparent;
        overflow: hidden;
        color: #111827;
        transform: rotateY(180deg);
        font-size: 11px;
        line-height: 1.4;
      }

      #tarotResult {
        margin-top: 24px;
        font-size: 13px;
        line-height: 1.7;
        text-align: center;
        color: #111827;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
      }

      #tarotResult strong {
        color: #c084fc;
        font-size: 15px;
      }

      .start-btn {
        margin-top: 70vh;

        padding: 16px 46px;

        border-radius: 999px;

        background: linear-gradient(135deg, #ffb7d5, #ff8fc2);

        border: 1px solid rgba(255, 255, 255, 0.7);

        color: white;

        font-size: 22px;
        font-weight: 600;

        font-family: 'Gaegu', cursive;

        letter-spacing: 1px;

        text-shadow: 0 2px 10px rgba(255, 255, 255, 0.45);

        box-shadow: 0 10px 30px rgba(255, 105, 180, 0.28);

        transition: 0.25s ease;
      }

      .start-btn:hover {
        transform: translateY(-3px) scale(1.04);

        background: linear-gradient(135deg, #ffc6e0, #ff9dcb);

        box-shadow: 0 14px 35px rgba(255, 105, 180, 0.35);
      }

      .start-btn:hover {
        transform: translateY(-2px) scale(1.03);

        background: rgba(255, 255, 255, 0.22);
      }

      .start-btn,

/* 타로 */
      #tarotScreen,
      #tarotScreen button,
      #tarotScreen .opening-title,
      #tarotScreen .opening-sub,
      .tarot-card,
      .tarot-front,
      .tarot-back,
      .tarot-title,
      .tarot-desc,
      #tarotResult,
      #tarotResult strong,

/* 테스트 */
      .question,
      .question-number,
      .answer-btn,

/* 결과 화면 */
      #resultScreen,
      #resultScreen .opening-sub,
      #resultScreen .result-title,
      #resultScreen .result-desc,
      #resultScreen .main-btn,

/* 다시하기 버튼 */
      .restart-btn {
        font-family: 'Gaegu', cursive;
      }
    </style>
  </head>
  <body>
    <div id="app-container">
      <!-- 오프닝 -->
      <section class="screen active" id="openingScreen">
        <button class="main-btn start-btn" onclick="startTarot()">
          Start♥
        </button>
      </section>

      <!-- 타로 스크린 -->
      <section class="screen" id="tarotScreen">
        <div class="opening-title">당신의 예술적 운명을 읽는 중...</div>

        <div class="opening-sub">끌리는 카드 3장을 선택하세요.</div>

        <div class="tarot-container" id="tarotContainer"></div>

        <div id="tarotResult"></div>

        <button
          class="main-btn"
          id="tarotNextBtn"
          style="display: none"
          onclick="goToTest()"
        >
          운명의 흐름 따라가기
        </button>
      </section>

      <!-- 테스트 -->
      <section class="screen" id="testScreen">
        <div class="test-container">
          <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <div class="question-number" id="questionNumber">QUESTION 01</div>
          <div class="question" id="questionText"></div>
          <div class="answer-list" id="answerList"></div>
        </div>
      </section>

      <!-- 결과 상영 화면 -->
      <section class="screen" id="resultScreen">
        <div class="result-box">
          <div
            class="opening-sub"
            style="margin-bottom: 8px; text-align: center"
          >
            당신을 기다리고 있는 선배
          </div>
          <div
            class="result-title"
            id="resultTitle"
            style="color: var(--primary)"
          >
            학과명
          </div>
          <div
            class="result-desc"
            id="resultDesc"
            style="
              font-size: 14px;
              text-align: center;
              color: var(--sub);
              margin-bottom: 20px;
            "
          >
            설명
          </div>
          <button
            class="main-btn"
            style="margin: 0 auto"
            onclick="startNovel()"
          >
            캠퍼스 문 열기
          </button>
        </div>
      </section>

      <!-- 비주얼노벨 파트 -->
      <section class="screen" id="novelScreen">
        <div id="bgLayer"></div>
        <div class="top-ui">SEOUL INSTITUTE OF THE ARTS</div>
        <div class="location-tag" id="locationTag">장소</div>
        <img class="character" id="character" />

        <div
          class="dialogue-box"
          id="dialogueBox"
          onclick="handleDialogueClick()"
        >
          <div><span class="name" id="name">선배</span></div>
          <div class="dialogue" id="dialogue">대사 로딩 중...</div>
          <div class="next-tip" id="nextTip">▼ 화면을 터치해 다음 대사로</div>
          <div
            class="choices"
            id="choices"
            onclick="event.stopPropagation()"
          ></div>
        </div>
      </section>

      <!-- 최종 엔딩 & 입시공고 아웃트로 스크린 -->
      <section class="screen" id="outroScreen">
        <div class="result-box">
          <div
            class="opening-sub"
            id="outroType"
            style="
              margin-bottom: 4px;
              font-weight: 600;
              text-align: center;
              color: var(--primary);
            "
          >
            CONGRATULATIONS
          </div>
          <div class="result-title" id="outroTitle">학과 전공 안내</div>

          <div class="info-card" id="outroInfo"></div>

          <a href="https://www.seoularts.ac.kr" target="_blank" class="link-btn"
            >✨ 서울예대 입시 홈페이지 바로가기</a
          >
          <a href="https://www.seoularts.ac.kr" target="_blank" class="link-btn"
            >📋 2027학년도 모집요강 확인하기</a
          >

          <button
            class="main-btn restart-btn"
            style="margin: 12px auto 0 auto; height: 46px; line-height: 46px"
            onclick="location.reload()"
          >
            처음부터 다시 하기
          </button>
        </div>
      </section>
    </div>

    <script>
      const screens = {
        opening: document.getElementById('openingScreen'),
        test: document.getElementById('testScreen'),
        result: document.getElementById('resultScreen'),
        novel: document.getElementById('novelScreen'),
        outro: document.getElementById('outroScreen'),
      };
      const questionText = document.getElementById('questionText'),
        answerList = document.getElementById('answerList'),
        progressBar = document.getElementById('progressBar'),
        questionNumber = document.getElementById('questionNumber');
      const resultTitle = document.getElementById('resultTitle'),
        resultDesc = document.getElementById('resultDesc');
      const nameEl = document.getElementById('name'),
        dialogueEl = document.getElementById('dialogue'),
        choicesEl = document.getElementById('choices'),
        characterEl = document.getElementById('character'),
        locationTag = document.getElementById('locationTag'),
        dialogueBox = document.getElementById('dialogueBox'),
        nextTip = document.getElementById('nextTip');
      const outroTitle = document.getElementById('outroTitle'),
        outroInfo = document.getElementById('outroInfo'),
        outroType = document.getElementById('outroType');

      let currentQuestion = 0,
        scriptIndex = 0,
        selectedRoute = '';
      let selectedTarots = [];
      let scores = {
        theatre: 0,
        broadcast: 0,
        visualdesign: 0,
        spacedesign: 0,
        dance: 0,
        acting: 0,
        film: 0,
        digitalart: 0,
        koreanmusic: 0,
        practicalmusic: 0,
        creativewriting: 0,
        playwriting: 0,
        photo: 0,
        advertising: 0,
        artsmanagement: 0,
      };

      const tarotCards = [
        {
          name: 'THE STAR',
          desc: '당신은 감정을 섬세하게 바라보는 사람입니다.',
          img: 'tarot1.png',
        },
        {
          name: 'THE MOON',
          desc: '무의식과 분위기에 강하게 끌리는 타입.',
          img: 'tarot2.png',
        },
        {
          name: 'THE SUN',
          desc: '사람의 시선을 자연스럽게 끌어당깁니다.',
          img: 'tarot3.png',
        },
        {
          name: 'THE FOOL',
          desc: '새로운 세계를 두려워하지 않는 예술가.',
          img: 'tarot4.png',
        },
        {
          name: 'THE LOVERS',
          desc: '사람과 감정의 연결에 민감합니다.',
          img: 'tarot5.png',
        },
        {
          name: 'THE MAGICIAN',
          desc: '상상을 현실로 만드는 창작 성향.',
          img: 'tarot6.png',
        },
        {
          name: 'THE WORLD',
          desc: '큰 흐름을 읽고 사람을 연결합니다.',
          img: 'tarot7.png',
        },
        {
          name: 'JUSTICE',
          desc: '균형과 판단 감각이 뛰어난 타입.',
          img: 'tarot8.png',
        },
        {
          name: 'TEMPERANCE',
          desc: '분위기와 감정을 자연스럽게 조율합니다.',
          img: 'tarot9.png',
        },
        {
          name: 'THE EMPRESS',
          desc: '아름다움과 감각에 민감합니다.',
          img: 'tarot10.png',
        },
        {
          name: 'THE EMPEROR',
          desc: '강한 추진력과 리더십을 지녔습니다.',
          img: 'tarot11.png',
        },
        {
          name: 'DEATH',
          desc: '새로운 변화를 두려워하지 않습니다.',
          img: 'tarot12.png',
        },
      ];

      // 🌸 [성향 테스트 구조 최적화] 복잡도를 대폭 낮춘 정밀한 2단계 유동형 질문 트리 구조로 변경
      const questions = [
        {
          question:
            '놀이공원에 간 당신. 연인이 “우리 뭐부터 할까?”라고 묻자 당신은?',
          answers: [
            {
              text: '“일단 지도부터 보자.”',
              types: ['artsmanagement', 'spacedesign'],
            },
            {
              text: '“야간 퍼레이드 시간 맞춰 움직이면 예쁠 듯.”',
              types: ['photo', 'film', 'visualdesign'],
            },
            {
              text: '“일단 제일 재밌어 보이는 거 타자!”',
              types: ['acting', 'dance', 'practicalmusic'],
            },
            {
              text: '“잠깐, 이런 상황 영화 첫 장면 같지 않냐?”',
              types: ['creativewriting', 'playwriting', 'advertising'],
            },
          ],
        },

        {
          question: '새벽 2시, 친구가 갑자기 고민 상담 전화를 했습니다.',
          answers: [
            {
              text: '“일단 왜 그런 상황이 된 건데?”',
              types: ['artsmanagement', 'advertising'],
            },
            {
              text: '조용히 끝까지 들어준다.',
              types: ['creativewriting', 'acting', 'koreanmusic'],
            },
            {
              text: '“밖에 나올래? 바람 쐬자.”',
              types: ['dance', 'broadcast', 'film'],
            },
            {
              text: '머릿속으로 그 장면을 상상한다.',
              types: ['photo', 'digitalart', 'visualdesign'],
            },
          ],
        },

        {
          question: '카페에 갔는데 창가 자리가 하나 남아 있습니다. 당신은?',

      function screenTransition(target) {
        Object.values(screens).forEach((s) => s.classList.remove('active'));
        screens[target].classList.add('active');
      }

      // 🌸 [분석 알고리즘 업데이트] 2단계 트리 구조 동작 제어 로직
      function startTest() {
        currentQuestion = 0;
        scores = Object.keys(scores).reduce((a, b) => ({ ...a, [b]: 0 }), {});
        screenTransition('test');
        loadQuestion();
      }

      function loadQuestion() {
        const q = questions[currentQuestion];

        progressBar.style.width =
          ((currentQuestion + 1) / questions.length) * 100 + '%';

        questionNumber.innerText =
          'QUESTION ' + String(currentQuestion + 1).padStart(2, '0');

        questionText.innerHTML = q.question;

        answerList.innerHTML = '';

        q.answers.forEach((ans) => {
          const btn = document.createElement('button');

          btn.classList.add('answer-btn');

          btn.innerHTML = ans.text;

          btn.onclick = () => {
            ans.types.forEach((t) => scores[t]++);

            currentQuestion++;

            if (currentQuestion >= questions.length) {
              evaluateResult();
            } else {
              loadQuestion();
            }
          };

          answerList.appendChild(btn);
        });
      }

      function evaluateResult() {
        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);

        const topScore = sorted[0][1];

        const candidates = sorted.filter(
          ([type, score]) => topScore - score <= 1,
        );

        const randomDept =
          candidates[Math.floor(Math.random() * candidates.length)][0];

        selectedRoute = randomDept;

        screens.test.classList.remove('active');
        screens.result.classList.add('active');

        resultTitle.innerHTML = '운명의 인연이 연결되었습니다';

        const randomMessages = [
          '누군가 당신을 기다리고 있습니다.',
          '당신과 가장 가까운 감각이 연결되었습니다.',
          '캠퍼스 어딘가에서 시선이 마주칩니다.',
          '당신의 이야기가 시작되려 합니다.',
          '익숙한 듯 낯선 인연이 다가옵니다.',
        ];

        resultDesc.innerHTML =
          randomMessages[Math.floor(Math.random() * randomMessages.length)];
      }

      function startNovel() {
        screenTransition('novel');
        document.getElementById('dialogueBox').style.display = 'block';
        scriptIndex = 0;
        renderScene();
      }

      function renderScene() {
        console.log(selectedRoute);
        console.log(scriptData[selectedRoute]);
        dialogueBox.style.display = 'block';
        const currentScript = scriptData[selectedRoute][scriptIndex];

        if (currentScript.img) {
          characterEl.src = `images/character/${currentScript.img}`;
        }

        if (
          currentScript.speaker === '안내' ||
          currentScript.speaker === '주변 학생' ||
          currentScript.speaker === '다른 학생' ||
          currentScript.speaker === '스튜디오 크루들' ||
          currentScript.speaker === '무대 크루들' ||
          currentScript.speaker === 'other 크루'
        ) {
          characterEl.style.opacity = '1';

          characterEl.style.filter =
            'grayscale(0.55) brightness(1.05) contrast(0.9) blur(0.4px) drop-shadow(0 10px 25px rgba(0,0,0,0.18))';
        } else {
          characterEl.style.opacity = '1';

          characterEl.style.filter =
            'drop-shadow(0 10px 25px rgba(0,0,0,0.18))';
        }

        nameEl.innerText = currentScript.speaker;
        locationTag.innerText = currentScript.location;
        const bgLayer = document.getElementById('bgLayer');

        const bgMap = {
          '빨간 계단': 'red-stairs.jpg',
          '예장극장 외부': 'theater-outside.jpg',
          '예장극장 내부': 'theater-inside.jpg',
          '캠퍼스 광장': 'campus-square-night.jpg',

          '계단 난간': 'stair-railing.jpg',
          '가동 앞': 'studio-front.jpg',
          '스튜디오 내부': 'filming-classroom.jpg',

          '마동 노을 지는 강의실 창가': 'creativewriting-room.jpg',
          '노을 지는 강의실 창가': 'classroom-window.jpg',

          '석양의 운동장': 'sunset-playground.jpg',
          연습실: 'practice-room.jpg',
          촬영장: 'film-set.jpg',

          작업실: 'design-studio.jpg',
        };

        const bgFile = bgMap[currentScript.location];

        if (bgFile) {
          bgLayer.style.backgroundImage = `url('images/background/${bgFile}')`;
        }
        dialogueEl.innerHTML = currentScript.text;

        if (currentScript.type === 'dialogue') {
          nextTip.style.display = 'block';
          choicesEl.innerHTML = '';
        } else if (currentScript.type === 'choice') {
          nextTip.style.display = 'none';
          choicesEl.innerHTML = '';
          currentScript.choices.forEach((ch) => {
            const btn = document.createElement('button');
            btn.classList.add('choice-btn');
            btn.innerText = ch.text;
            btn.onclick = () => {
              if (ch.next === 'restart') {
                location.reload();
              } else if (ch.jumpTo === 'outro_theatre') {
                showOutro('theatre');
              } else if (ch.jumpTo === 'outro_broadcast') {
                showOutro('broadcast');
              } else if (ch.jumpTo === 'outro_visualdesign') {
                showOutro('visualdesign');
              } else if (ch.jumpTo === 'outro_spacedesign') {
                showOutro('spacedesign');
              } else if (ch.jumpTo === 'outro_dance') {
                showOutro('dance');
              } else if (ch.jumpTo === 'outro_acting') {
                showOutro('acting');
              } else if (ch.jumpTo === 'outro_film') {
                showOutro('film');
              } else if (ch.jumpTo === 'outro_digitalart') {
                showOutro('digitalart');
              } else if (ch.jumpTo === 'outro_koreanmusic') {
                showOutro('koreanmusic');
              } else if (ch.jumpTo === 'outro_practicalmusic') {
                showOutro('practicalmusic');
              } else if (ch.jumpTo === 'outro_creativewriting') {
                showOutro('creativewriting');
              } else if (ch.jumpTo === 'outro_playwriting') {
                showOutro('playwriting');
              } else if (ch.jumpTo === 'outro_photo') {
                showOutro('photo');
              } else if (ch.jumpTo === 'outro_advertising') {
                showOutro('advertising');
              } else if (ch.jumpTo === 'outro_artsmanagement') {
                showOutro('artsmanagement');
              } else {
                scriptIndex = ch.jumpTo;
                renderScene();
              }
            };
            choicesEl.appendChild(btn);
          });
        }

        if (bgFile) {
          bgLayer.style.backgroundImage = `url('images/background/${bgFile}')`;
        }
      }

      function handleDialogueClick() {
        const currentScript = scriptData[selectedRoute][scriptIndex];
        if (currentScript.type === 'choice') return;

        if (currentScript.nextIndex !== undefined) {
          scriptIndex = currentScript.nextIndex;
        } else {
          scriptIndex++;
        }

        if (scriptIndex < scriptData[selectedRoute].length) {
          renderScene();
        }
      }

      function showOutro(type) {
        screenTransition('outro');
        const data = outroDetails[type];
        outroType.innerText = data.type;
        outroTitle.innerText = data.title;
        outroInfo.innerHTML = data.html;
      }

      function startTarot() {
        const bgm = document.getElementById('bgm');

        bgm.volume = 0.35;

        bgm.play().catch(() => {
          console.log('브금 재생 실패');
        });
        // opening 화면 숨기기
        screens.opening.classList.remove('active');

        // tarot 화면 활성화 (screens 객체 사용)
        const tarotScreen = document.getElementById('tarotScreen');
        tarotScreen.classList.add('active');

        const container = document.getElementById('tarotContainer');
        container.innerHTML = '';

        tarotCards.forEach((cardData) => {
          const card = document.createElement('div');
          card.className = 'tarot-card';

          card.innerHTML = `
                 <div class="tarot-front">
                <img src="images/tarot/back.png"
                style="
                width:100%;
                height:100%;
                object-fit:cover;
                border-radius:16px;">
                </div>

                  <div class="tarot-back">
        <img
          src="images/tarot/${cardData.img}"
          style="
            width:100%;
            height:100%;
            object-fit:cover;
            border-radius:16px;">
      </div>
                `;

          card.onclick = () => {
            if (
              card.classList.contains('flipped') ||
              selectedTarots.length >= 3
            ) {
              return;
            }

            card.classList.add('flipped');

            selectedTarots.push(cardData);

            updateTarotResult();

            if (selectedTarots.length === 3) {
              document.getElementById('tarotNextBtn').style.display = 'block';
            }
          };

          container.appendChild(card);
        });
      }

      function updateTarotResult() {
        const result = document.getElementById('tarotResult');

        result.innerHTML = selectedTarots
          .map(
            (card) => `
                    <div style="margin-bottom:12px;">
                      ✦ <strong>${card.name}</strong><br>
                      ${card.desc}
                    </div>
                  `,
          )
          .join('');
      }

      function goToTest() {
        document.getElementById('tarotScreen').classList.remove('active');

        startTest();
      }
      document.addEventListener(
        'click',
        () => {
          const bgm = document.getElementById('bgm');

          if (bgm.paused) {
            bgm.volume = 0;

            bgm.play();

            let volume = 0;

            const fadeIn = setInterval(() => {
              if (volume < 0.35) {
                volume += 0.01;

                bgm.volume = volume;
              } else {
                clearInterval(fadeIn);
              }
            }, 120);
          }
        },
        { once: true },
      );
    </script>
    <audio id="bgm" autoplay loop>
      <source src="music/opening.mp3" type="audio/mp3" />
    </audio>
  </body>
</html>
